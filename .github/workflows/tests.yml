name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: docker pull alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
      - run: python -m unittest discover -s tests -p test_docker.py -v
        env:
          EASYAGENTIC_TEST_DOCKER_IMAGE: alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
  live-model:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: model-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -p test_live.py -v
        env:
          EASYAGENTIC_RUN_LIVE: '1'
          OPENAI_API_KEY: ${{ secrets.MODEL_API_KEY }}
          EASYAGENTIC_MODEL: ${{ vars.MODEL || 'gpt-4o' }}
