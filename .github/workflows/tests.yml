name: Tests
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m ruff check .
  tests:
    name: Tests (Linux, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-ci.txt
      - run: python -m pip install -r requirements.lock -r requirements-ci.txt
      - run: python -m coverage run -m unittest discover -s tests -v
      - name: Combine subprocess coverage
        if: always()
        run: python -m coverage combine
      - name: Coverage thresholds
        run: |
          python -m coverage report --fail-under=80
          python -m coverage report --include="agent_runtime/execution.py,agent_runtime/review.py,agent_runtime/messages.py,tools/team.py,tools/write_file.py" --fail-under=85
      - name: Generate reports
        if: always()
        run: |
          python -m coverage xml
          python -m coverage html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
          if-no-files-found: warn
  security:
    uses: ./.github/workflows/security.yml
  docker:
    name: Docker isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: docker pull alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
      - run: python -m unittest discover -s tests -p test_docker.py -v
        env:
          EASYAGENTIC_TEST_DOCKER_IMAGE: alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
  gate:
    name: CI gate
    if: always()
    needs: [lint, tests, coverage, security, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required checks failed, skipped or cancelled: ' + ', '.join(failed))
          print('All required checks passed')
          PY
  live-model:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: model-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -p test_live.py -v
        env:
          EASYAGENTIC_RUN_LIVE: '1'
          OPENAI_API_KEY: ${{ secrets.MODEL_API_KEY }}
          EASYAGENTIC_MODEL: ${{ vars.MODEL || 'gpt-4o' }}
